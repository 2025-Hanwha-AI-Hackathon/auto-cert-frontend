version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-cert-frontend:latest
    container_name: auto-cert-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

